name: Verifica client Smarkets
on:
  push:
    branches: [main]
    paths:
      - scripts/fetch_smarkets_outrights.py
      - scripts/diagnose_smarkets_http.py
      - tests/test_smarkets_http.py
      - .github/workflows/diagnose-smarkets.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install --quiet pytest requests numpy scipy pandas PyYAML
      - name: Regressione client e collettori (senza rete)
        run: >-
          python -m pytest -q tests/test_smarkets_http.py
          tests/test_smarkets_matches.py tests/test_smarkets_live.py
          tests/test_outright_archive.py
      - name: API reali con il client condiviso (sola lettura)
        run: python -u scripts/diagnose_smarkets_http.py
