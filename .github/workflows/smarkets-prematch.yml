name: Raccolta quote pre-partita Smarkets (test prospettico Fase 78)

# PERCHE' ESISTE (Fase 116). Il test prospettico della Fase 78 -- previsioni
# congelate prima del calcio d'inizio e scorate dopo -- e' il gold standard che
# il progetto non ha mai potuto eseguire, e cio' che non si raccoglie prima del
# fischio d'inizio e' perso per sempre (newseason.md §2). Smarkets e' una borsa
# con API pubblica senza chiave: da' banco, puntatore e volumi (su Betfair
# sarebbero piani a pagamento) ed e' raggiungibile senza account ne' VPS
# (Fase 115). Nessun segreto da configurare.
#
# COSTO: zero. Quattro esecuzioni al giorno, pochi secondi ciascuna, dentro il
# piano gratuito di GitHub Actions.
#
# SOLA LETTURA di dati pubblici: il progetto non scommette (CLAUDE.md §5).

on:
  schedule:
    # DENSO, ogni 6 ore: tutti i mercati delle partite entro 72h. E' la
    # traiettoria che si addensa verso il calcio d'inizio.
    - cron: '17 */6 * * *'
    # LUNGO RAGGIO, una volta al giorno: tutte le partite che l'API espone
    # (misurato: ~1 giornata per lega, 48 partite) ma solo sui mercati che il
    # motore consuma. Senza questo, fino al 12 agosto non si raccoglierebbe
    # NULLA -- mentre il listino dell'esordio e' gia' quotato e si muove da
    # oggi, e quei giorni non si recuperano (newseason.md §2).
    - cron: '41 5 * * *'
    # CHIUSURA, ogni ora ma solo su cio' che inizia entro 2 ore (decisione D1,
    # Fase 129). Il regime denso a 6 ore lascerebbe l'ultimo prezzo vecchio
    # fino a 6 ore: per il Modello 2 del test prospettico quello NON e' una
    # chiusura, ed e' contro la chiusura che il progetto misura da 100 fasi
    # (alfa*=0, Fase 16). Un giro orario con finestra a 2h da' un prezzo a
    # T-1h/T-2h e costa quasi nulla: nelle ore senza partite lo script esce
    # PRIMA di chiedere le quote e non scrive alcun file, quindi il costo e'
    # una chiamata di listino l'ora (~20 giri a vuoto al giorno) e zero byte
    # in archivio. Nessun flag `--solo-principali`: la chiusura e' l'unico
    # istante in cui vale la pena avere il listino Tier 1 intero (risultato
    # esatto compreso), perche' e' l'unica occasione di validare il nostro
    # listino contro un libro vero -- e dopo il fischio non si recupera.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      entro_ore:
        description: 'Raccogli le partite che iniziano entro N ore'
        default: '72'
      lungo_raggio:
        description: 'Tutto cio che l API espone, solo mercati principali'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: smarkets-prematch
  cancel-in-progress: false

jobs:
  raccogli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Raccogli le quote pre-partita
        run: |
          # Quale regime: lo decide il cron che ha fatto partire il giro
          # (github.event.schedule e' vuoto per un avvio a mano).
          if [ "${{ github.event.schedule }}" = "41 5 * * *" ] \
             || [ "${{ github.event.inputs.lungo_raggio }}" = "true" ]; then
            python scripts/fetch_smarkets_matches.py --tutte-le-esposte --solo-principali
          elif [ "${{ github.event.schedule }}" = "7 * * * *" ]; then
            # CHIUSURA: finestra stretta, e da oggi TUTTI i mercati esposti
            # (~110 per partita invece di 6). E' il momento in cui il prezzo
            # vale di piu' e in cui non si recupera piu': dopo il fischio non
            # esiste. Fra i 104 mercati che prima buttavamo ci sono corner,
            # cartellini, primo/secondo tempo, HT/FT e le combinazioni -- cioe'
            # meta' del listino che il progetto prezza SENZA una quota di
            # riferimento contro cui misurarsi.
            #
            # Sostenibile solo grazie al batching (LOTTO_MERCATI): a chiamate
            # per-mercato servivano 221 richieste a partita e il giro moriva di
            # timeout; a lotti di 20 sono 13, e una partita si chiude in ~5 s.
            # Costo misurato: 343 righe/partita, 484 byte/riga -> ~1,6 MB in un
            # sabato di punta con 10 partite in finestra.
            #
            # Nelle ore vuote lo script esce senza scrivere e il passo dopo non
            # trova nulla da committare: e' il comportamento voluto, non un guasto.
            python scripts/fetch_smarkets_matches.py --entro-ore 2 --tutti-i-mercati
          else
            python scripts/fetch_smarkets_matches.py \
              --entro-ore "${{ github.event.inputs.entro_ore || 72 }}"
          fi

      - name: Salva lo snapshot (se c'e' qualcosa da salvare)
        run: |
          if [ -z "$(git status --porcelain data/smarkets_matches/)" ]; then
            echo "nessuna partita in finestra: niente da committare (non e' un errore)"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/smarkets_matches/
          git commit -m "Smarkets: quote pre-partita $(date -u +'%Y-%m-%d %H:%M UTC')"
          # il push puo' fallire per una corsa con un altro commit: si riprova
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((5 * i))
          done
          echo "push fallito dopo 3 tentativi"; exit 1
