name: Raccolta quote pre-partita Smarkets (test prospettico Fase 78)

# PERCHE' ESISTE (Fase 116). Il test prospettico della Fase 78 -- previsioni
# congelate prima del calcio d'inizio e scorate dopo -- e' il gold standard che
# il progetto non ha mai potuto eseguire, e cio' che non si raccoglie prima del
# fischio d'inizio e' perso per sempre (newseason.md §2). Smarkets e' una borsa
# con API pubblica senza chiave: da' banco, puntatore e volumi (su Betfair
# sarebbero piani a pagamento) ed e' raggiungibile senza account ne' VPS
# (Fase 115). Nessun segreto da configurare.
#
# COSTO: zero. Quattro esecuzioni al giorno, pochi secondi ciascuna, dentro il
# piano gratuito di GitHub Actions.
#
# SOLA LETTURA di dati pubblici: il progetto non scommette (CLAUDE.md §5).

on:
  schedule:
    # DENSO, ogni 6 ore: tutti i mercati delle partite entro 72h. E' la
    # traiettoria che si addensa verso il calcio d'inizio.
    - cron: '17 */6 * * *'
    # LUNGO RAGGIO, una volta al giorno: tutte le partite che l'API espone,
    # a listino pieno (il flag `--solo-principali` e' caduto il 02/08, §5-ter).
    # Misurato l'08/08/2026 col perimetro della Fase 142: **158 partite** --
    # 58 dei campionati, 52 di coppa, 48 di seconda divisione -- per ~29 min
    # di giro, dentro il budget di 45 dello script.
    # Senza questo giro, fino al 12 agosto non si raccoglierebbe NULLA --
    # mentre il listino dell'esordio e' gia' quotato e si muove da oggi, e
    # quei giorni non si recuperano (newseason.md §2).
    - cron: '41 5 * * *'
    # CHIUSURA, ogni ora ma solo su cio' che inizia entro 2 ore (decisione D1,
    # Fase 129). Il regime denso a 6 ore lascerebbe l'ultimo prezzo vecchio
    # fino a 6 ore: per il Modello 2 del test prospettico quello NON e' una
    # chiusura, ed e' contro la chiusura che il progetto misura da 100 fasi
    # (alfa*=0, Fase 16). Un giro orario con finestra a 2h da' un prezzo a
    # T-1h/T-2h e costa quasi nulla: nelle ore senza partite lo script esce
    # PRIMA di chiedere le quote e non scrive alcun file, quindi il costo e'
    # una chiamata di listino l'ora (~20 giri a vuoto al giorno) e zero byte
    # in archivio. Nessun flag `--solo-principali`: la chiusura e' l'unico
    # istante in cui vale la pena avere il listino Tier 1 intero (risultato
    # esatto compreso), perche' e' l'unica occasione di validare il nostro
    # listino contro un libro vero -- e dopo il fischio non si recupera.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      entro_ore:
        description: 'Raccogli le partite che iniziano entro N ore'
        default: '72'
      lungo_raggio:
        description: 'Tutto cio che l API espone, a listino pieno'
        type: boolean
        default: false
      # Aggiunto l'08/08/2026 dopo averne avuto bisogno. Il cron orario di
      # GitHub parte con **30-40 minuti di ritardo** (misurato quel giorno:
      # 08:54 / 09:49 / 10:45 / 11:37 per i cron delle :07), e non c'era modo
      # di forzare a mano il regime di CHIUSURA -- finestra stretta e listino
      # pieno. Un avvio a mano finiva nel ramo generico, che prende i soli 6
      # mercati di base: metà del listino perduta proprio nell'ora in cui il
      # prezzo vale di piu' e in cui non si recupera dopo.
      tutti_i_mercati:
        description: 'Listino pieno (~110 mercati) anche con una finestra stretta'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # UN GRUPPO PER REGIME (Fase 142). Prima era uno solo, e col perimetro
  # allargato e' costato dati veri nel giro di poche ore.
  #
  # La regola di GitHub e': per ogni gruppo puo' esserci **un run in corso e
  # UNO SOLO pending**, e all'arrivo di un terzo *«any previously pending job
  # or workflow in the concurrency group will be canceled»*. Con i giri corti
  # (58 partite, 20 min) non capitava mai; con 158 partite un lungo raggio
  # occupa il gruppo per ~35-45 minuti, e nel frattempo bastano due corse
  # orarie accodate perche' la prima venga **cancellata**.
  # Misurato l'08/08/2026: run 31258806209 delle 13:07 -> `cancelled`.
  #
  # A morire e' proprio il giro che vale di piu': la CHIUSURA e' il prezzo a
  # T-2h, e dopo il fischio non esiste piu' (newseason.md §2). E muore in
  # silenzio -- un run `cancelled` non scrive niente e non suona niente.
  #
  # Separarli e' sicuro: i due regimi scrivono file con nomi diversi
  # (timestamp al secondo) e l'unica risorsa condivisa e' il push su main, che
  # ha gia' il suo ciclo di 3 tentativi con `pull --rebase --autostash`.
  group: >-
    smarkets-prematch-${{ github.event.schedule == '7 * * * *'
      && 'chiusura' || 'lungo' }}
  cancel-in-progress: false

jobs:
  raccogli:
    runs-on: ubuntu-latest
    # Rete di sicurezza esterna al budget dello script (BUDGET_MINUTI = 90,
    # ri-tarato l'08/08 dopo che il primo giro col perimetro allargato ha
    # esaurito i 45 e perso 22 partite su 157):
    # se il processo si pianta invece di rallentare, il budget -- che si
    # controlla fra una partita e l'altra -- non scatta. Il default di GitHub
    # e' 6 ore, e sei ore di runner appeso bloccherebbero anche tutte le corse
    # orarie di chiusura che si accodano dietro la stessa `concurrency`.
    timeout-minutes: 100
    env:
      # Senza questo lo stdout di Python esce tutto in blocco alla
      # fine e i timestamp del log di Actions sono inutilizzabili: la
      # durata di un giro si e' potuta misurare solo a posteriori dal
      # file (08/08). Un log che non dice QUANDO non serve a diagnosi.
      PYTHONUNBUFFERED: '1'
    steps:
      # Senza questo lo stdout di Python esce tutto in blocco alla fine, e i
      # timestamp del log di Actions diventano inutilizzabili: la durata di un
      # giro si e' potuta misurare solo a posteriori dal file (08/08).
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Raccogli le quote pre-partita
        run: |
          # Quale regime: lo decide il cron che ha fatto partire il giro
          # (github.event.schedule e' vuoto per un avvio a mano).
          if [ "${{ github.event.schedule }}" = "41 5 * * *" ] \
             || [ "${{ github.event.inputs.lungo_raggio }}" = "true" ]; then
            # LUNGO RAGGIO: tutte le partite esposte, e da oggi TUTTI i mercati
            # (decisione utente 02/08/2026, regola §5-ter). Costa ~16 MB per
            # giro a listino pieno, ma l'archivio e' COMPRESSO (19,6x) quindi
            # sono ~800 KB effettivi: ~230 MB su una stagione intera.
            # Cio' che non si raccoglie prima del fischio non torna piu'.
            python scripts/fetch_smarkets_matches.py --tutte-le-esposte --tutti-i-mercati
          elif [ "${{ github.event.schedule }}" = "7 * * * *" ]; then
            # CHIUSURA: finestra stretta, e da oggi TUTTI i mercati esposti
            # (~110 per partita invece di 6). E' il momento in cui il prezzo
            # vale di piu' e in cui non si recupera piu': dopo il fischio non
            # esiste. Fra i 104 mercati che prima buttavamo ci sono corner,
            # cartellini, primo/secondo tempo, HT/FT e le combinazioni -- cioe'
            # meta' del listino che il progetto prezza SENZA una quota di
            # riferimento contro cui misurarsi.
            #
            # Sostenibile solo grazie al batching (LOTTO_MERCATI): a chiamate
            # per-mercato servivano 221 richieste a partita e il giro moriva di
            # timeout; a lotti di 20 sono 13, e una partita si chiude in ~5 s.
            # Costo misurato: 343 righe/partita, 484 byte/riga -> ~1,6 MB in un
            # sabato di punta con 10 partite in finestra.
            #
            # Nelle ore vuote lo script esce senza scrivere e il passo dopo non
            # trova nulla da committare: e' il comportamento voluto, non un guasto.
            python scripts/fetch_smarkets_matches.py --entro-ore 2 --tutti-i-mercati
          else
            # Avvio a mano (o cron denso ogni 6h). `--tutti-i-mercati` solo se
            # richiesto: il default resta il listino base, che e' cio' che il
            # cron denso ha sempre fatto.
            EXTRA=""
            if [ "${{ github.event.inputs.tutti_i_mercati }}" = "true" ]; then
              EXTRA="--tutti-i-mercati"
            fi
            python scripts/fetch_smarkets_matches.py \
              --entro-ore "${{ github.event.inputs.entro_ore || 72 }}" $EXTRA
          fi

      - name: Salva lo snapshot (se c'e' qualcosa da salvare)
        # ANCHE SE IL PASSO PRIMA E' FALLITO (08/08/2026). Lo script scrive il
        # file PRIMA di uscire rosso, apposta: «il file e' salvo, l'allarme e'
        # visibile». Ma senza questo `if` il passo di commit veniva SALTATO,
        # il file restava sul runner e moriva con lui -- cioe' l'allarme
        # costava esattamente i dati che doveva proteggere. Vale per tutte e
        # tre le uscite rosse: lega sparita, partite perse, raccolta a zero
        # (in quest'ultimo caso non c'e' nulla da committare e il passo esce
        # da solo). `!cancelled()` e non `always()`: se il giro e' stato
        # annullato a mano, non si committa.
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(git status --porcelain data/smarkets_matches/)" ]; then
            echo "nessuna partita in finestra: niente da committare (non e' un errore)"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/smarkets_matches/
          git commit -m "Smarkets: quote pre-partita $(date -u +'%Y-%m-%d %H:%M UTC')"
          # il push puo' fallire per una corsa con un altro commit: si riprova
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((5 * i))
          done
          echo "push fallito dopo 3 tentativi"; exit 1
