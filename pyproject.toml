[project]
name = "football-oracle"
version = "0.1.0"
description = "Motore di stima delle probabilita reali di eventi sportivi (calcio), indipendente dalle piattaforme di scommessa."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Il minimo per far girare `python -m pytest` VERDE su un clone pulito.
# ⚠️ bs4 e openpyxl non servono al modello, ma servono ai TEST: senza,
# `src/data/wikipedia_careers.py` non si importa (9 errori in raccolta) e
# `registra_raccolta_*_diretta.py` non legge gli .xlsx archiviati (6 falliti).
# Erano assenti da qui fino all'11/08/2026: la suite era verde solo sulle
# macchine dove qualcuno li aveva installati a mano.
dev = [
    "pytest>=7.0",
    "beautifulsoup4>=4.11",
    "openpyxl>=3.1",
]
# I COLLETTORI che parlano con Polymarket (`scripts/fetch_polymarket_open.py`
# e quindi `archive_outrights.py`). Il lato Smarkets usa `urllib` e non chiede
# niente; questo lato chiede `requests`.
# ⚠️ Dichiarato qui solo dalla Fase 156: era una dipendenza scritta in nessun
# posto, e sui runner di GitHub Actions -- dove il progetto non si installa --
# ha fatto morire 4 run su 4 del collettore outright e 10 del guardiano.
raccolta = [
    "requests>=2.28",
]
# Modelli di famiglia diversa dal Dixon-Coles (Fase 21+): gradient boosting,
# ecc. Non serve al modello core ne' ai test — solo agli script _run_*_gbm.
models = [
    "scikit-learn>=1.3",
]
# Solo per specchiare in locale la documentazione API di Betfair
# (scripts/fetch_betfair_docs.py). Non serve al modello, ne' ai test, ne' a
# scaricare i dati: e' un comodo per non ri-cercare le specifiche sul web.
docs = [
    "markdownify>=0.11",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
